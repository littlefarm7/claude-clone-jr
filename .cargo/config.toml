# whisper.cpp (built into Claudio for speech recognition) must not be tuned to
# the build machine: target x86-64-v3 (AVX2/FMA, CPUs from ~2013 on) so the
# same binary runs on users' computers.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
