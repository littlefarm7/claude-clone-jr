[package]
name = "claudio-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
claudio-core = { path = "../claudio-core" }
claudio-llm = { path = "../claudio-llm" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
tempfile.workspace = true
libc = "0.2"
tracing.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
dunce = "1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
dirs.workspace = true
whisper-rs = "0.16"
hound = "3"
zeroize.workspace = true
shell-words = "1"
ignore = "0.4"
globset = "0.4"
html2text = "0.12"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
calamine = "0.37"
rust_xlsxwriter = "0.100"
csv = "1"
tar = "0.4"
flate2 = "1"
pdf-extract = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
axum = "0.8"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
trash = "5"
cpal = "0.16"
