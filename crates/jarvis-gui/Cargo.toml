[package]
name = "jarvis-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jarvis-gui"
path = "src/main.rs"

[dependencies]
jarvis-core = { path = "../jarvis-core" }
jarvis-llm = { path = "../jarvis-llm" }
jarvis-tools = { path = "../jarvis-tools" }
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
egui_extras = { version = "0.31", default-features = false }
