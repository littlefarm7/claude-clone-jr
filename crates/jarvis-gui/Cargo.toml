[package]
name = "jarvis-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jarvis-gui"
path = "src/main.rs"

[dependencies]
jarvis-core = { path = "../jarvis-core" }
jarvis-llm = { path = "../jarvis-llm" }
jarvis-tools = { path = "../jarvis-tools" }
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = { version = "0.31", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["x11", "wayland"] }

[build-dependencies]
winresource = "0.1"
