[workspace]
resolver = "2"
members = ["crates/jarvis-llm", "crates/jarvis-core", "crates/jarvis-tools", "crates/jarvis-cli", "crates/jarvis-gui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/littlefarm7/claude-clone-jr"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
tracing = "0.1"
dirs = "6"
toml = "0.8"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
